# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      EA_CLIENT_ID: ${{ secrets.EA_CLIENT_ID }}
      EA_CLIENT_SECRET: ${{ secrets.EA_CLIENT_SECRET }}
      UK_CLIENT_ID: ${{ secrets.UK_CLIENT_ID }}
      UK_CLIENT_SECRET: ${{ secrets.UK_CLIENT_SECRET }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test with pytest
      run: |
        # Exclude any integration tests that require reading/writing to files or using selenium
        pytest -m "not integration"
